# configs/v3_social_mlp.yaml
#
# IntentTrajNet-AV2 — V3 Configuration
# Multi-task: detection + intention + Social-Aware MLP trajectory decoder
# Same ViT backbone as V1/V2 — isolates the effect of richer trajectory modeling
#
# Research question:
#   Does adding social agent interaction context and explicit map awareness
#   to the trajectory decoder further improve shared backbone representations
#   and intention accuracy beyond V2's auxiliary MLP trajectory head?
#
# What's new vs V2:
#   - Map BEV explicitly sampled at agent locations → [N, 9]
#   - Social attention across N agents → agents attend to each other
#   - Linear projection before attention → [N, 526] → [N, 256]
#   SOURCED: DeTra object self-attention (Casas et al. 2024)
#            HiVT global interaction module (Zhou et al. 2022)

# ─────────────────────────────────────────────
# Model
# ─────────────────────────────────────────────
model:
  version: "V3"
  use_trajectory: true

  backbone:
    type: "vit"
    # Identical to V1 and V2 — backbone held constant across all versions
    # SOURCED: Nadeem thesis Section 3.3
    vit_model_name_lidar: "vit_small_patch8_224"
    vit_model_name_map: "vit_small_patch8_224"
    pretrained_lidar: false
    pretrained_map: false
    lidar_adapter_out_channels: 192
    map_adapter_out_channels: 192
    fusion_block_planes: 512
    fusion_block_layers: 2
    fusion_block_kernel_size: 3
    fusion_block_stride: 1

  trajectory:
    decoder_type: "social_mlp"
    # Social + Map-Aware MLP decoder
    # Pipeline: BEV[N,512] + Map[N,9] + BoxParams[N,5] → Linear(526→256)
    #           → SocialAttention → BEVTrajectoryDecoder(MLP)
    # SOURCED: DeTra object self-attention (Casas et al. 2024)
    #          HiVT global interaction module (Zhou et al. 2022)
    future_steps: 30
    # 3 seconds × 10Hz — matches intention horizon
    # SOURCED: IntentNet (Casas et al. 2018)
    num_modes: 6
    # SOURCED: Abdulbaki thesis Section 3.4.3
    hidden_size: 256
    # SOURCED: V2 ablation confirmed 256
    min_scale: 0.001
    # SOURCED: HiVT decoder.py
    mlp_dropout: 0.0
    # No dropout — same as V2 for fair comparison

# ─────────────────────────────────────────────
# Data
# ─────────────────────────────────────────────
data:
  train_dir: "/content/local_data/train"
  val_dir:   "/content/local_data/val"
  future_traj: true
  # True → loads future_traj_ego [N,30,2] and future_traj_mask [N,30]
  gt_frame: "ego"

# ─────────────────────────────────────────────
# Training
# ─────────────────────────────────────────────
training:
  batch_size: 8
  num_epochs: 10
  num_workers: 0

  optimizer:
    type: "AdamW"
    lr: 0.0001
    weight_decay: 0.0001
    # SOURCED: Nadeem thesis Section 3.4 — same as V1/V2 for fair comparison

  scheduler:
    type: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.1
    patience: 3

# ─────────────────────────────────────────────
# Loss
# ─────────────────────────────────────────────
loss:
  use_rotated_iou: false
  apply_intention_downsampling: true
  intention_downsample_ratio: 0.85

  iou_threshold: 0.6
  neg_iou_threshold: 0.45
  box_weight: 1.0
  cls_weight: 1.0
  intent_weight: 0.5
  # SOURCED: Nadeem thesis Section 3.4 — unchanged from V1/V2

  traj_lambda: 0.0125
  # Same as V2 — confirmed by V2 ablation over {0.01, 0.1, 0.5, 1.0}
  # SOURCED: Caruana (1997) multi-task learning

# ─────────────────────────────────────────────
# Evaluation
# ─────────────────────────────────────────────
eval:
  confidence_threshold: 0.1
  nms_iou_threshold: 0.2
  use_rotated_iou: false
  use_rotated_nms: false
  use_agent_local_traj: true
  batch_size: 8

  trajectory_metrics:
    miss_rate_threshold_m: 2.0
    # SOURCED: Abdulbaki thesis Section 3.7

# ─────────────────────────────────────────────
# Checkpoints
# ─────────────────────────────────────────────
checkpoints:
  save_dir: "/content/drive/MyDrive/Bachelor Thesis/Checkpoints"
  filename: "MultiTask_V3.pth"
  resume: "/content/drive/MyDrive/Bachelor Thesis/Checkpoints/MultiTask_V3_epoch9.pth"
  pretrained_v1: ""