# configs/v3_transformer_traj.yaml
#
# IntentTrajNet-AV2 — V3 Configuration
# Change vs V2: full trajectory system upgrade with same ViT backbone
#   - Transformer cross-attention decoder (replaces MLP)
#   - GRU history encoder [N, 50, 5] → [N, 64]
#   - Social attention across N agents
#   - Dual-dataset training: sensor → det+intent, parquet → trajectory
#   - Focal agent only for trajectory training loss
#
# Research question:
#   Does upgrading from auxiliary MLP trajectory to a dedicated
#   transformer-based system with agent history and social context
#   improve detection, intention, and trajectory prediction quality?
#   (backbone unchanged from V2 — isolates trajectory system contribution)
#
# SOURCED: GRU history — Abdulbaki thesis Section 3.6
# SOURCED: transformer decoder — Abdulbaki thesis Section 5.3 (future work)
# SOURCED: social attention — HiVT (Zhou et al., CVPR 2022)
# SOURCED: dual-dataset training — UniDet (Zhou et al., 2021)

# ─────────────────────────────────────────────
# Model
# ─────────────────────────────────────────────
model:
  version: "V3"
  use_trajectory: true

  backbone:
    type: "vit"
    # UNCHANGED from V2 — same ViT backbone isolates trajectory contribution
    # SOURCED: Nadeem thesis Section 3.3
    vit_model_name_lidar: "vit_small_patch8_224"
    vit_model_name_map: "vit_small_patch8_224"
    pretrained_lidar: false
    pretrained_map: false
    # SOURCED: trained from scratch — Nadeem thesis Section 3.4
    lidar_adapter_out_channels: 192
    map_adapter_out_channels: 192
    fusion_block_planes: 512
    fusion_block_layers: 2
    fusion_block_kernel_size: 3
    fusion_block_stride: 1

  trajectory:
    decoder_type: "transformer"
    # NEW for V3 — replaces MLP decoder from V2
    # TransformerTrajectoryDecoder in trajectory_decoder.py

    future_steps: 60
    # SOURCED: Abdulbaki thesis Section 3.1 — 6 seconds × 10Hz

    num_modes: 6
    # SOURCED: Abdulbaki thesis Section 3.4.3

    hidden_size: 256
    # SOURCED: V2 ablation confirmed 256 best of {128, 256, 512}

    min_scale: 0.001
    # SOURCED: HiVT decoder.py

    # GRU history encoder
    gru_hidden: 64
    # CONFIRMED by 2-epoch ablation over {32, 64, 128} on 10 logs / 20 parquet scenarios
    # gru=64: Traj drop=2.46, Cls=0.649 — best trajectory drop, best detection
    # gru=32: Traj drop=1.08, Cls=0.648 — underfits, insufficient capacity
    # gru=128: Traj drop=1.66, Cls=0.661 — larger model hurts detection, less drop

    # Transformer decoder
    num_heads: 8
    # STANDARD PRACTICE: 256/8=32 dimensions per head — consistent with BERT-base
    # Not ablated: standard default for hidden_size=256, no evidence to deviate

    num_decoder_layers: 2
    # STANDARD PRACTICE: conservative depth for small dataset (100 parquet scenarios)
    # Deeper decoders (6+) overfit on small datasets; single layer may underfit
    # Not ablated: 2 is a well-justified middle ground, noted as future work

    # Social attention
    social_heads: 4
    # STANDARD PRACTICE: 256/4=64 per head, identical to BERT-base per-head size
    # Not ablated: standard for small-N self-attention (N<130 agents per scene)

    social_layers: 1
    # STANDARD PRACTICE: single social attention layer used in HiVT, Social-LSTM
    # Not ablated: universally accepted for social context encoding

    dropout: 0.1
    # STANDARD PRACTICE: regularization for small dataset (100 parquet scenarios)

# ─────────────────────────────────────────────
# Data
# ─────────────────────────────────────────────
data:
  train_dir: "/content/local_data/train"
  # Full 50 sensor logs — 7375 sequences for detection + intention training
  val_dir: "/content/local_data/val"
  future_traj: true
  gt_frame: "ego"

  parquet_train_dir: "/content/local_mf/train"
  # Full 100 parquet scenarios — trajectory head training only

  parquet_val_dir: "/content/local_mf/val"
  # 48 val scenarios — trajectory evaluation (MF protocol)

# ─────────────────────────────────────────────
# Training
# ─────────────────────────────────────────────
training:
  batch_size: 8
  num_epochs: 10
  # Full training — 10 epochs same as V1/V2
  num_workers: 0

  optimizer:
    type: "AdamW"
    lr: 0.0001
    # Single LR for all parameters — same as V1/V2
    # No differential LR needed — ViT trained from scratch
    # SOURCED: Nadeem thesis Section 3.4
    weight_decay: 0.0001

  scheduler:
    type: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.1
    patience: 3

# ─────────────────────────────────────────────
# Loss
# ─────────────────────────────────────────────
loss:
  use_rotated_iou: false
  apply_intention_downsampling: true
  intention_downsample_ratio: 0.85

  iou_threshold: 0.6
  neg_iou_threshold: 0.45
  box_weight: 1.0
  cls_weight: 1.0
  intent_weight: 0.5
  # UNCHANGED from V1/V2 — Nadeem thesis Section 3.4

  traj_lambda: 0.1
  # CONFIRMED by 2-epoch ablation over {0.1, 0.3} on 10 logs / 20 parquet scenarios
  # λ=0.1: Traj drop=2.46, Cls=0.649 — larger drop, better detection
  # λ=0.3: Traj drop=1.43, Cls=0.668 — smaller drop, worse detection
  # Consistent with Swin ablation result — λ=0.1 confirmed for both backbones

# ─────────────────────────────────────────────
# Evaluation
# ─────────────────────────────────────────────
eval:
  confidence_threshold: 0.1
  nms_iou_threshold: 0.2
  use_rotated_iou: false
  use_rotated_nms: false
  use_agent_local_traj: true
  batch_size: 8

  eval_focal_only: true
  # Report focal-agent minADE (MF protocol — comparable to Abdulbaki)
  eval_all_agents: true
  # Also report all-agent minADE (comparable to V2 auxiliary trajectory)

  trajectory_metrics:
    miss_rate_threshold_m: 2.0
    # SOURCED: Abdulbaki thesis Section 3.7

# ─────────────────────────────────────────────
# Checkpoints
# ─────────────────────────────────────────────
checkpoints:
  save_dir: "/content/drive/MyDrive/Bachelor Thesis/Checkpoints"
  filename: "MultiTask_V3.pth"
  resume: "/content/drive/MyDrive/Bachelor Thesis/Checkpoints/MultiTask_V3_epoch6.pth"
  # Set to epoch checkpoint path to resume after Colab reset
  # e.g. resume: "/content/drive/MyDrive/Bachelor Thesis/Checkpoints/MultiTask_V3_epoch7.pth"
  pretrained_v2: ""
  # Optional: initialise from V2 checkpoint
  # Backbone weights transfer, trajectory head initialises from scratch