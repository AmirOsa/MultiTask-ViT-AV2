# configs/v1_baseline.yaml
#
# IntentTrajNet-AV2 — V1 Configuration
# Nadeem baseline: detection + intention only
# No trajectory head — identical to Nadeem's original IntentNetViT
#
# Research question: What is the baseline detection and intention performance?

# ─────────────────────────────────────────────
# Model
# ─────────────────────────────────────────────
model:
  version: "V1"
  use_trajectory: false
  # False → TrajectoryHead not created
  # MultiTaskLoss behaves identically to Nadeem's DetectionIntentionLoss

  backbone:
    type: "vit"
    # SOURCED: Nadeem thesis Section 3.3
    vit_model_name_lidar: "vit_small_patch8_224"
    vit_model_name_map: "vit_small_patch8_224"
    pretrained_lidar: false
    pretrained_map: false
    # SOURCED: trained from scratch — Nadeem thesis Section 3.4
    lidar_adapter_out_channels: 192
    map_adapter_out_channels: 192
    fusion_block_planes: 512
    fusion_block_layers: 2
    fusion_block_kernel_size: 3
    fusion_block_stride: 1

# ─────────────────────────────────────────────
# Data
# ─────────────────────────────────────────────
data:
  train_dir: "/content/local_data/train"
  val_dir:   "/content/local_data/val"
  future_traj: false
  # False → dataset does not load future_traj_ego or future_traj_mask
  # Saves memory and preprocessing time for V1

# ─────────────────────────────────────────────
# Training
# ─────────────────────────────────────────────
training:
  batch_size: 8
  num_epochs: 10
  num_workers: 0

  optimizer:
    type: "AdamW"
    lr: 0.0001
    weight_decay: 0.0001
    # SOURCED: Nadeem thesis Section 3.4

  scheduler:
    type: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.1
    patience: 3
    # SOURCED: Nadeem thesis Section 3.4

# ─────────────────────────────────────────────
# Loss
# ─────────────────────────────────────────────
loss:
  use_rotated_iou: false
  apply_intention_downsampling: true
  intention_downsample_ratio: 0.85
  # SOURCED: Nadeem thesis Section 3.4

  iou_threshold: 0.6
  neg_iou_threshold: 0.45
  box_weight: 1.0
  cls_weight: 1.0
  intent_weight: 0.5
  # SOURCED: Nadeem thesis Section 3.4

  traj_lambda: 0.0
  # Zero — trajectory loss disabled for V1

# ─────────────────────────────────────────────
# Evaluation
# ─────────────────────────────────────────────
eval:
  confidence_threshold: 0.1
  nms_iou_threshold: 0.2
  use_rotated_iou: false
  use_rotated_nms: false        # NEW — NOT YET DECIDED 4
  use_agent_local_traj: false   # NEW — V1 has no trajectory, irrelevant but needed
  batch_size: 8

# ─────────────────────────────────────────────
# Checkpoints
# ─────────────────────────────────────────────
checkpoints:
  save_dir: "/content/drive/MyDrive/Bachelor Thesis/Checkpoints"
  filename: "MultiTask_V1.pth"
  resume: "/content/drive/MyDrive/Bachelor Thesis/Checkpoints/MultiTask_V1_epoch6.pth"  #remove after finishing training