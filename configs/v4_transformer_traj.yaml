# configs/v4_transformer_traj.yaml
#
# IntentTrajNet-AV2 — V4 Configuration
# Change vs V3: full trajectory system upgrade
#   - Transformer cross-attention decoder (replaces MLP)
#   - GRU history encoder [N, 50, 5] → [N, 64]
#   - Social attention across N agents
#   - Dual-dataset training: sensor → det+intent, parquet → trajectory
#   - Focal agent only for trajectory training loss
#
# Research question:
#   Does upgrading from auxiliary MLP trajectory to a dedicated
#   transformer-based system with agent history and social context
#   improve detection, intention, and trajectory prediction quality?
#
# SOURCED: GRU history — Abdulbaki thesis Section 3.6
# SOURCED: transformer decoder — Abdulbaki thesis Section 5.3 (future work)
# SOURCED: social attention — HiVT (Zhou et al., CVPR 2022)
# SOURCED: dual-dataset training — UniDet (Zhou et al., 2021)

# ─────────────────────────────────────────────
# Model
# ─────────────────────────────────────────────
model:
  version: "V4"
  use_trajectory: true

  backbone:
    type: "swin"
    # UNCHANGED from V3 — backbone is not the variable being tested in V4
    swin_model_name: "swin_tiny_patch4_window7_224"
    pretrained: true
    window_size: 5
    out_channels: 512

  trajectory:
    decoder_type: "transformer"
    # NEW for V4 — replaces MLP decoder from V2/V3
    # TransformerTrajectoryDecoder in trajectory_decoder.py

    future_steps: 60
    # SOURCED: Abdulbaki thesis Section 3.1 — 6 seconds × 10Hz

    num_modes: 6
    # SOURCED: Abdulbaki thesis Section 3.4.3

    hidden_size: 256
    # SOURCED: V2 ablation confirmed 256 best of {128, 256, 512}

    min_scale: 0.001
    # SOURCED: HiVT decoder.py

    # GRU history encoder
    gru_hidden: 64
    # ASSUMED: confirmed by 3-epoch ablation over {32, 64, 128}
    # Lightweight encoder — avoids overfitting on 100 scenarios
    # SOURCED: input_size=5 from Abdulbaki thesis Section 3.6

    # Transformer decoder
    num_heads: 8
    # ASSUMED: confirmed by 3-epoch ablation over {4, 8}
    # Must divide hidden_size evenly: 256/8=32 ✓

    num_decoder_layers: 2
    # ASSUMED: confirmed by 3-epoch ablation over {1, 2, 3}
    # Conservative — avoids overfitting on 100 parquet scenarios

    # Social attention
    social_heads: 4
    # ASSUMED: confirmed by 3-epoch ablation over {2, 4}
    # Smaller than decoder heads — N agents is small (~10-30)
    # Must divide hidden_size evenly: 256/4=64 ✓

    social_layers: 1
    # ASSUMED: lightweight single layer — avoids overfitting

    dropout: 0.1
    # Regularization — important with only 100 training scenarios

# ─────────────────────────────────────────────
# Data
# ─────────────────────────────────────────────
data:
  train_dir: "/content/local_data/train"
  # Sensor dataset — used for detection + intention training
  # Same 50 logs as V1/V2/V3 — 7375 sequences

  val_dir: "/content/local_data/val"
  # Sensor dataset — used for detection + intention evaluation

  future_traj: true
  # True → dataset loads future_traj_ego and future_traj_mask
  # Still needed for V4 sensor batches (trajectory GT from annotations)
  # Used in V3-traj ablation comparison

  gt_frame: "ego"

  parquet_train_dir: "/content/local_mf/train"
  # MF-format parquet scenarios from sensor_to_mf.py
  # 100 training scenarios from 50 sensor logs
  # Used for trajectory head training only (dual-dataset)

  parquet_val_dir: "/content/local_mf/val"
  # 48 val scenarios — used for trajectory evaluation

# ─────────────────────────────────────────────
# Training
# ─────────────────────────────────────────────
training:
  batch_size: 8
  # Sensor dataloader batch size — same as V1/V2/V3
  # Parquet dataloader uses batch_size=1 (N varies per scenario)

  num_epochs: 10
  num_workers: 0

  optimizer:
    type: "AdamW"
    lr_backbone: 0.00001
    # UNCHANGED from V3 — pretrained Swin backbone uses lower LR
    # SOURCED: Howard & Ruder (ACL 2018) — discriminative fine-tuning
    lr_heads: 0.0001
    # Standard LR for detection, intention, trajectory heads
    # SOURCED: Nadeem thesis Section 3.4
    weight_decay: 0.0001

  scheduler:
    type: "ReduceLROnPlateau"
    mode: "min"
    factor: 0.1
    patience: 3

# ─────────────────────────────────────────────
# Loss
# ─────────────────────────────────────────────
loss:
  use_rotated_iou: false
  apply_intention_downsampling: true
  intention_downsample_ratio: 0.85

  iou_threshold: 0.6
  neg_iou_threshold: 0.45
  box_weight: 1.0
  cls_weight: 1.0
  intent_weight: 0.5
  # UNCHANGED from V1/V2/V3 — Nadeem thesis Section 3.4

  traj_lambda: 0.1
  # Starting value — to be confirmed by 3-epoch ablation over {0.1, 0.3, 0.5}
  # V4 trajectory loss characteristics differ from V2/V3:
  #   - Focal agent only → fewer agents → different loss scale
  #   - Better decoder → loss drops faster
  #   - Parquet batches every ~70 iterations → less frequent than V2/V3
  # Ablation will determine if 0.1 remains optimal or higher value needed

# ─────────────────────────────────────────────
# Evaluation
# ─────────────────────────────────────────────
eval:
  confidence_threshold: 0.1
  nms_iou_threshold: 0.2
  use_rotated_iou: false
  use_rotated_nms: false
  # UNCHANGED from V1/V2/V3 — axis-aligned NMS for fair comparison

  use_agent_local_traj: true
  # Transform trajectory to agent-local frame
  # SOURCED: Abdulbaki thesis Section 3.6

  batch_size: 8

  # Parquet evaluation settings
  eval_focal_only: true
  # True → report focal-agent minADE (MF protocol, comparable to Abdulbaki)
  eval_all_agents: true
  # True → also report all-agent minADE (comparable to V2/V3 aux trajectory)

  trajectory_metrics:
    miss_rate_threshold_m: 2.0
    # SOURCED: Abdulbaki thesis Section 3.7

# ─────────────────────────────────────────────
# Checkpoints
# ─────────────────────────────────────────────
checkpoints:
  save_dir: "/content/drive/MyDrive/Bachelor Thesis/Checkpoints"
  filename: "MultiTask_V4.pth"
  resume: ""
  pretrained_v3: ""
  # Optional: initialise from V3 checkpoint
  # Swin backbone weights transfer, new trajectory components init from scratch
  # Leaving empty → Swin loads ImageNet pretrained weights via timm